{% extends 'base.html' %}

{% block body_class %}page-login{% endblock %}

{% block content %}
<h2>Login</h2>
<form method="post" class="login-form">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>
<p class="signup-link"><a href="{% url 'signup' %}">Don't have an account? Sign up</a></p>
{% endblock %}
