{% extends 'base.html' %}

{% block body_class %}page-signup{% endblock %}

{% block content %}
<div class="wrap">
<h2>Sign Up</h2>
<form method="post" class="signup-form">
  {% csrf_token %}
  {{ form.as_p }}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button type="submit" class="btn btn-primary">Sign Up</button>
</form>
</div>
{% endblock %}
