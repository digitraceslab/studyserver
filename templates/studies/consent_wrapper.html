{% extends 'base.html' %}

{% block body_class %}page-consent{% endblock %}

{% block content %}
<div class="consent-content">
{% autoescape off %}
    {{ content }}
{% endautoescape %}
</div>

<br/>
<a href="{% url 'dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
{% endblock %}

{% if scroll_to %}
<script>
    document.getElementById('{{ scroll_to }}').scrollIntoView({ behavior: 'smooth' });
</script>
{% endif %}
