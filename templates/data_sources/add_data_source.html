{% extends 'base.html' %}

{% block body_class %}page-add-data-source{% endblock %}

{% block content %}
<div class="wrap">

<h1>Add a new data source</h1>
<form method="post" class="data-source-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Data Source</button>
</form>

</div>
{% endblock %}
