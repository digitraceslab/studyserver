<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Study Server{% endblock %}</title>
    {% if study.custom_css %}<style>{{ study.custom_css|safe }}</style>{% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <main class="page-content">{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        {% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a> | {% else %}<a href="{% url 'login' %}">Login</a> | {% endif %}
        <a href="{% url 'study_detail' %}">Study</a> |
        <a href="{% url 'privacy_statement' %}">Privacy Statement</a> |
        <a href="{% url 'terms_of_service' %}">Terms of Service</a>
    </footer>
</body>
</html>
