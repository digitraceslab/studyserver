{% extends "admin/base_site.html" %}

{% block content %}
<p>Send an email to participant <strong>{{ original.pseudo_id }}</strong>. The
recipient address is not shown to keep the participant's identity private.</p>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="submit-row">
    <input type="submit" value="Send email" class="default">
    <a href="{{ change_url }}" class="closelink">Cancel</a>
  </div>
</form>
{% endblock %}
